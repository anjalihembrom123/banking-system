version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: banking_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - banking_network

  backend:
    build: ./backend
    container_name: banking_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/banking_system
    depends_on:
      - mongodb
    networks:
      - banking_network

  frontend:
    build: ./frontend
    container_name: banking_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - banking_network

networks:
  banking_network:
    driver: bridge

volumes:
  mongo_data: